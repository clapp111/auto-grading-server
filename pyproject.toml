[tool.ruff]
target-version = "py310"
required-version = ">=0.16.0"

[tool.ruff.lint]
select = ["F", "I", "UP", "B008", "BLE001", "SIM113", "RUF059"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI resolves these dependency declarations; they are not mutable defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
